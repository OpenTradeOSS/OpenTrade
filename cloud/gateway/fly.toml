# OpenTrade Cloud gateway (staging). Secrets: see cloud/README.md.
app = "opentrade-gateway"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SANDBOX_DRIVER = "fly"
  FLY_SANDBOX_APP = "opentrade-sandbox"
  FLY_SANDBOX_REGION = "iad"

[http_service]
  internal_port = 8787
  force_https = true
  # One gateway owns the SQLite DB and the in-flight sandbox jobs: never scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[mounts]
  source = "gateway_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
